name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: 'v__VERSION__'
          releaseName: 'ProTrack v__VERSION__'
          releaseBody: |
            ## ProTrack v0.1.0

            A simple project tracker for managing milestones and progress.

            ### Features
            - Create projects with weighted milestones (totaling 100%)
            - Track progress automatically as milestones are completed
            - Drag & drop to reorder projects
            - Archive and restore projects
            - Responsive layout that fills the window

            ### Platforms
            - macOS (Apple Silicon & Intel) — .dmg / .app
            - Windows — .msi / .exe
            - Linux — .deb / .rpm / AppImage

            Built with Rust and Tauri v2. MIT licensed.
          releaseDraft: false
          prerelease: false
